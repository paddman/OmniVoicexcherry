name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest numpy soundfile gradio
      - name: Compile package
        run: python -m compileall -q omnivoice
      - name: Run studio and utility tests
        run: |
          pytest -q \
            tests/test_thai_text.py \
            tests/test_data_quality.py \
            tests/test_preflight_helpers.py \
            tests/test_training_studio_helpers.py
